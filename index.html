<!DOCTYPE html>

  @media (prefers-color-scheme: dark) { :root { --bg: #15181a; --fg: #e8eae8; --muted: #9aa2a7; --line: #30363a; --accent: #6fb1d9; color-scheme: dark; } }

  .shell { display: flex; flex-direction: column; height: 100%; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: space-between; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .bar a { color: var(--accent); }
  iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
</style>
</head>
<body>
<div class="shell">
  <div class="bar">

</div>

  document.getElementById('open').href = APP_URL;
</script>
</body>
</html>
